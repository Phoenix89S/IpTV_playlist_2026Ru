name: NGENIX CDN Constellation

on:
  workflow_dispatch:

  # январь → май → сентябрь → январь
  schedule:
    - cron: "0 4 1 1,5,9 *"

permissions:
  contents: write

concurrency:
  group: ngenix-cdn-constellation
  cancel-in-progress: false

jobs:
  constellation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create output directories
        run: |
          mkdir -p data/ngenix_constellation
          mkdir -p reports/ngenix_constellation

      - name: Run NGENIX CDN Constellation
        run: |
          python FVNgenix_cdn_constellation.py \
            --root . \
            --output-dir data/ngenix_constellation \
            --report-dir reports/ngenix_constellation \
            --timeout 5 \
            --read-limit 8192

      - name: Verify generated artifacts
        run: |
          set -e

          test -s data/ngenix_constellation/NGENIX_CDN_CONSTELLATION.m3u
          test -s data/ngenix_constellation/NGENIX_CDN_CONSTELLATION.json
          test -s data/ngenix_constellation/NGENIX_CDN_CONSTELLATION_HISTORY.json
          test -s reports/ngenix_constellation/NGENIX_CDN_CONSTELLATION_SKALA.txt

          echo "=== Generated artifacts ==="

          ls -lh \
            data/ngenix_constellation/NGENIX_CDN_CONSTELLATION.m3u \
            data/ngenix_constellation/NGENIX_CDN_CONSTELLATION.json \
            data/ngenix_constellation/NGENIX_CDN_CONSTELLATION_HISTORY.json \
            reports/ngenix_constellation/NGENIX_CDN_CONSTELLATION_SKALA.txt

      - name: Write heartbeat
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" \
            > data/ngenix_constellation/LAST_RUN_UTC.txt

      - name: Commit generated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/ngenix_constellation/ \
            reports/ngenix_constellation/

          if git diff --cached --quiet; then
            echo "ERROR: Nothing staged for commit."
            exit 1
          fi

          git commit \
            -m "NGENIX CDN Constellation: $(date -u +'%Y-%m-%d')"

      - name: Push results
        run: |
          git push origin HEAD:${GITHUB_REF_NAME}