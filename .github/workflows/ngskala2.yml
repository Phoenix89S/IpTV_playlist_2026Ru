name: NGENIX-SKALA-DREG-Playlist-Builder

on:
  workflow_dispatch:      # ← РУЧНОЙ ПИНОК
  push:
    paths:
      - "ngSKALA_2.py"    # автозапуск при изменении генератора
  schedule:
      - cron: "0 3 * * 1"   # запуск раз в неделю

jobs:
  build-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Получение репозитория
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Установка Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Запуск генератора плейлиста ngSKALA_2.py
        run: |
          python ngSKALA_2.py

      - name: Проверка результата
        run: |
          if [ ! -f "ngSKALA.m3u" ]; then
            echo "Файл ngSKALA.m3u не создан!"
            exit 1
          fi

      - name: Коммит результата в репозиторий
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add ngSKALA.m3u
          git commit -m "Автообновление плейлиста ngSKALA.m3u"
          git push