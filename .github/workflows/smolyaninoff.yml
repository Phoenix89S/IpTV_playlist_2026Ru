name: Smolyaninov Scanner

on:
  schedule:
    - cron: "0 3 */5 * *"   # запуск каждые 5 дней в 03:00 UTC
  workflow_dispatch:         # ручной запуск (пинок)

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run Smolyaninov Scanner
        run: python Nikolai_Smolyaninoff.py

      - name: Commit playlist and report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p output
          mv smolnp.m3u output/
          mv smolnp.txt output/
          git add output/
          git commit -m "Автообновление плейлиста и отчёта (СКАЛА ЧАЭС)"
          git push