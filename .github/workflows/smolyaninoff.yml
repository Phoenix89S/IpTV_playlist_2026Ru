- name: Versioning smolnp files
        run: |
          mkdir -p output

          # Base names
          BASE_M3U="smolnp"
          BASE_TXT="smolnp"

          # Find next version number
          LAST_NUM=$(ls -1 | grep -E "${BASE_M3U}_[0-9]+\.m3u" | sed -E 's/.*_([0-9]+)\.m3u/\1/' | sort -n | tail -1)
          if [ -z "$LAST_NUM" ]; then
            NEXT_NUM=1
          else
            NEXT_NUM=$((LAST_NUM + 1))
          fi

          # New filenames
          NEW_M3U="${BASE_M3U}_${NEXT_NUM}.m3u"
          NEW_TXT="${BASE_TXT}_${NEXT_NUM}.txt"

          # Copy original files to versioned names
          cp smolnp.m3u "$NEW_M3U"
          cp smolnp.txt "$NEW_TXT"

          # Copy everything to output/
          cp smolnp.m3u smolnp.txt output/
          cp "$NEW_M3U" "$NEW_TXT" output/

      - name: Commit and push updated files
        run: |
          git config user.name "Phoenix-Auto"
          git config user.email "actions@github.com"

          git add smolnp.m3u smolnp.txt
          git add smolnp_*.m3u smolnp_*.txt
          git add output/

          git commit -m "Auto-update smolnp files (versioned)"
          git push