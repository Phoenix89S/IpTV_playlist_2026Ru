Name: ZABAVA TAILS SCAN

on:
  workflow_dispatch:

  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  zabava-tails:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests PyYAML

      - name: Download latest script version
        run: |
          curl -sSL "https://raw.githubusercontent.com/Phoenix89S/IpTV_playlist_2026Ru/main/zabava_tails.py" -o zabava_tails.py

      - name: Run ZABAVA TAILS scanner
        run: |
          echo "========================================"
          echo "       START ZABAVA TAILS SCAN"
          echo "========================================"

          python zabava_tails.py

          echo "========================================"
          echo "       ZABAVA TAILS SCAN FINISHED"
          echo "========================================"

      - name: Show generated files
        run: |
          echo "Generated files:"
          ls -lh \
            zabava_tails.txt \
            zabava_tails.json \
            zabava_tails.yaml \
            zabava_scan.log

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            zabava_tails.txt \
            zabava_tails.json \
            zabava_tails.yaml \
            zabava_scan.log

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "Update ZABAVA tails and YAML [skip ci]"
            git push
          fi
