name: SKALA Logger — Run 33892073670

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  skala_logger:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Run SKALA_logger.py
        run: |
          set -Eeuo pipefail

          test -s SKALA_logger.py

          python SKALA_logger.py \
            "https://github.com/Phoenix89S/IpTV_playlist_2026Ru/actions/runs/33892073670" \
            --output "SKALA_RUN_33892073670.txt" \
            --export-number "1"

      - name: Verify result
        run: |
          set -Eeuo pipefail

          test -s SKALA_RUN_33892073670.txt

          echo "=============================================="
          echo " SKALA LOGGER — ГОТОВ"
          echo "=============================================="
          ls -lh SKALA_RUN_33892073670.txt
          echo "=============================================="

      - name: Commit TXT to repository
        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add SKALA_RUN_33892073670.txt

          git commit -m "SKALA Logger: Run 33892073670"

          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main