name: NGENIX-SKALA-DREG-Reverse-Refactor

on:
  workflow_dispatch:        # ← РУЧНОЙ ПИНОК
  push:
    paths:
      - "ngSKALA_reverse.py"   # автозапуск при изменении файла
  schedule:
    - cron: "0 */6 * * *"      # автозапуск каждые 6 часов

jobs:
  reverse-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Получение репозитория
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Установка Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Запуск обратного рефакторинга ngSKALA_reverse.py
        run: |
          python ngSKALA_reverse.py

      - name: Проверка результата
        run: |
          if [ ! -f "ngSKALA_reverse.txt" ]; then
            echo "Файл ngSKALA_reverse.txt не создан!"
            exit 1
          fi

      - name: Коммит результата в репозиторий
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add ngSKALA_reverse.txt
          git commit -m "Автообновление отчёта ngSKALA_reverse.txt"
          git push