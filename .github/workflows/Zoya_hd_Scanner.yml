name: Zoya HD Scanner

on:
  schedule:
    # Запуск каждые 6 часов (в 00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Кнопка для ручного запуска из интерфейса GitHub

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Проверка и скачивание кода из репозитория
        uses: actions/checkout@v4

      - name: Настройка окружения Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установка необходимых библиотек
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Запуск скрипта сканера
        run: |
          # Запуск вашего файла из корня репозитория
          python IPTV_zoya_hd_py --start 1 --end 25000 --workers 30 --output scan_channels_named.m3u

      - name: Сохранение и пуш обновленного плейлиста в GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add scan_channels_named.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update playlist: $(date -u +'%Y-%m-%d %H:%M UTC')" && git push)
