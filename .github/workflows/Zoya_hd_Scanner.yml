name: IPTV Zoya HD Generator

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"  # каждые 4 часа

jobs:
  generate-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (если нужны)
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run IPTV_zoya_hd_py
        run: |
          chmod +x IPTV_zoya_hd_py
          python IPTV_zoya_hd_py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Добавь сюда конкретные файлы, которые генерит скрипт
          git add .

          if git diff --cached --quiet; then
            echo "Нет изменений — коммит не нужен."
            exit 0
          fi

          git commit -m "Auto-update IPTV Zoya HD playlist"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}