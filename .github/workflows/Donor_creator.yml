name: Donor_Creator автоматическое обновление IPTV Donor 89S

on:
  schedule:
    # Запуск каждые 6 часов (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Ручной запуск кнопкой из интерфейса GitHub

jobs:
  run-dreg-skala-bot:
    runs-on: ubuntu-latest
    name: Принудительный запуск ДРЭГ/СКАЛА [main & output]

    steps:
      - name: 1. Клонирование репозитория
        uses: actions/checkout@v4

      - name: 2. Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 4. Запуск робота сборки (Donor_creator.py)
        run: |
          python Donor_creator.py

      - name: 5. Размещение файлов в папки main/ и output/
        run: |
          mkdir -p main output

          if [ -f "donor89s_updated.m3u" ]; then
            cp donor89s_updated.m3u main/donor89s_updated.m3u
            cp donor89s_updated.m3u output/donor89s_updated.m3u
            cp donor89s_updated.m3u donor89s.m3u || true
          fi

          if [ -f "report_dreg_skala.txt" ]; then
            cp report_dreg_skala.txt main/report_dreg_skala.txt
            cp report_dreg_skala.txt output/report_dreg_skala.txt
          fi

      - name: 6. Принудительный коммит и отправка (Push) в обе папки
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add main/ output/ *.m3u *.txt || true
          
          # Всегда делаем коммит и push принудительно, даже если diff пустой (штамп времени обновится)
          git commit -m "ДРЭГ/СКАЛА: Принудительное обновление отчетов и плейлистов [main & output]" || echo "Нет новых изменений для коммита"
          git push || echo "Push пропущен или выполнен"
