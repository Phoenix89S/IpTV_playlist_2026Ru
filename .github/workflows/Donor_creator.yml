name: Donor_Creator автоматическое  обновление IPTV Donor 89S

on:
  schedule:
    # Запуск каждые 6 часов (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Возможность ручного запуска кнопкой из интерфейса GitHub

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    name: Запуск робота сборки и публикация результатов

    steps:
      - name: Проверка и получение кода репозитория
        uses: actions/checkout@v4

      - name: Настройка среды Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Установка зависимостей и библиотек
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Запуск робота-сборщика (Donor_creator.py)
        run: |
          python Donor_creator.py

      - name: Сохранение результатов и коммит в директории main и output
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Создаем целевые директории main и output
          mkdir -p main output

          # Дублируем сгенерированные файлы плейлистов и отчетов в обе директории
          if [ -f "donor89s_updated.m3u" ]; then
            cp donor89s_updated.m3u main/
            cp donor89s_updated.m3u output/
          fi

          if [ -f "report_dreg_skala.txt" ]; then
            cp report_dreg_skala.txt main/
            cp report_dreg_skala.txt output/
          fi

          # Индексируем файлы в main, output и корне репозитория
          git add main/ output/ *.m3u *.txt || true

          # Проверяем наличие изменений и делаем коммит
          if git diff --staged --quiet; then
            echo "Изменений в плейлисте и отчетах не обнаружено. Коммит не требуется."
          else
            git commit -m "Автоматический коммит: обновление плейлистов [main & output]"
            git push
          fi
