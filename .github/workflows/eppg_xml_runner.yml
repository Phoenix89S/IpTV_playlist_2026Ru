name: Run EPPG XML 2016 Extractor

on:
  workflow_dispatch: # Запуск вручную по кнопке из вкладки Actions
  schedule:
    - cron: '0 4 * * 1' # Автозапуск каждый понедельник в 04:00 UTC

# Полные права на запись в ветку
permissions:
  contents: write

jobs:
  run-xml-extractor:
    runs-on: ubuntu-latest

    steps:
      - name: Чекаут репозитория
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Скачиваем историю для корректного pull/push без конфликтов

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Запуск eppg_xml.py
        run: python eppg_xml.py

      - name: Загрузка результатов в артефакты
        uses: actions/upload-artifact@v4
        with:
          name: eppg-xml-2016-results
          path: |
            xml_2016_aliases.txt
            xml_2016_knowledge.json

      - name: Фиксация изменений и Гарантированный Push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Индексируем сгенерированные файлы
          git add xml_2016_aliases.txt xml_2016_knowledge.json
          
          # Проверяем, появились ли изменения
          if git diff --staged --quiet; then
            echo "Новых данных нет, пропускаем коммит."
            exit 0
          fi
          
          git commit -m "Auto-update EPPG XML 2016 metadata [skip ci]"
          
          # Синхронизация с удаленной веткой для исключения конфликтов
          git pull --rebase origin main
          
          # Гарантированный пуш с прямым токеном авторизации
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git HEAD:main
