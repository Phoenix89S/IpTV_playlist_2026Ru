name: SKALA Logger

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: skala-logger
  cancel-in-progress: false

jobs:
  skala_logger:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          set -Eeuo pipefail

          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Run SKALA logger
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_RUN_URL: "https://github.com/Phoenix89S/IpTV_playlist_2026Ru/actions/runs/33892073670"
        run: |
          set -Eeuo pipefail

          test -s SKALA_python_export_run.py
          python -m py_compile SKALA_python_export_run.py

          RUN_ID="$(printf '%s' "$TARGET_RUN_URL" | sed -E 's#.*/actions/runs/([0-9]+).*#\1#')"

          if ! [[ "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "[ERROR] Не удалось определить RUN_ID из TARGET_RUN_URL"
            exit 1
          fi

          OUTPUT="SKALA_RUN_${RUN_ID}.txt"

          echo "[INFO] Целевой Run: $RUN_ID"
          echo "[INFO] Выходной файл: $OUTPUT"

          python SKALA_python_export_run.py \
            "$TARGET_RUN_URL" \
            --output "$OUTPUT" \
            --export-number "1"

          test -s "$OUTPUT"

          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "OUTPUT=$OUTPUT" >> "$GITHUB_ENV"

      - name: Commit and push
        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git rebase origin/main

          git add "$OUTPUT"

          if git diff --cached --quiet; then
            echo "[INFO] Новых изменений нет."
            exit 0
          fi

          git commit -m "SKALA Logger: Run $RUN_ID"

          git push origin HEAD:main