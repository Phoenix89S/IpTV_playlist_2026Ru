name: ngg_scan_ai

on:
  schedule:
    # Автоматический запуск: 1 раз в месяц,
    # 1-го числа в 06:00 UTC
    - cron: '0 6 1 * *'

  # Ручной запуск из интерфейса GitHub
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ngg-scan-ai
  cancel-in-progress: false

jobs:
  scan-and-update:
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # 1. Получение ВСЕЙ истории репозитория
      # ---------------------------------------------------------
      - name: Чтение репозитория
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # ---------------------------------------------------------
      # 2. Настройка Python 3.10
      # ---------------------------------------------------------
      - name: Настройка Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # ---------------------------------------------------------
      # 3. Установка зависимостей
      # ---------------------------------------------------------
      - name: Установка зависимостей
        shell: bash
        run: |
          set -e

          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install scikit-learn numpy joblib requests
          fi

      # ---------------------------------------------------------
      # 4. Проверка окружения
      # ---------------------------------------------------------
      - name: Проверка окружения
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "        ПРОВЕРКА ОКРУЖЕНИЯ"
          echo "========================================"

          python --version
          echo "Рабочая директория: $(pwd)"
          echo "Ветка: $(git branch --show-current)"
          echo "Последний commit:"
          git log -1 --oneline

          if [ ! -f ai_scan_ngg.py ]; then
            echo "ОШИБКА: ai_scan_ngg.py не найден."
            exit 1
          fi

          echo "[OK] ai_scan_ngg.py найден."

      # ---------------------------------------------------------
      # 5. Определение НОМЕРА ТЕКУЩЕГО ЗАПУСКА
      #
      # Нумерация:
      # playlist_1.m3u
      # playlist_2.m3u
      # playlist_3.m3u
      # ...
      #
      # Старые версии НЕ удаляются.
      # ---------------------------------------------------------
      - name: Определение номера следующего запуска
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "     ОПРЕДЕЛЕНИЕ НОМЕРА ЗАПУСКА"
          echo "========================================"

          LAST=0

          # Ищем максимальный номер среди playlist_N.m3u
          while IFS= read -r file; do
            number=$(echo "$file" | sed -nE 's/^playlist_([0-9]+)\.m3u$/\1/p')

            if [ -n "$number" ] && [ "$number" -gt "$LAST" ]; then
              LAST="$number"
            fi
          done < <(
            find . -maxdepth 1 -type f \
              -name 'playlist_*.m3u' \
              -printf '%f\n'
          )

          NEXT=$((LAST + 1))

          echo "Последняя версия: $LAST"
          echo "Новая версия:     $NEXT"

          # Передаём номер всем последующим шагам
          echo "NGG_RUN_NUMBER=$NEXT" >> "$GITHUB_ENV"

      # ---------------------------------------------------------
      # 6. Запуск AI NGG Scan
      #
      # NGG_RUN_NUMBER доступен Python-программе через окружение.
      # ---------------------------------------------------------
      - name: Запуск AI NGG Scan
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "       START AI NGG SCAN"
          echo "========================================"

          echo "Номер запуска: $NGG_RUN_NUMBER"

          NGG_RUN_NUMBER="$NGG_RUN_NUMBER" \
            python ai_scan_ngg.py --scan

          echo "========================================"
          echo "       AI NGG SCAN FINISHED"
          echo "========================================"

      # ---------------------------------------------------------
      # 7. Проверка всех созданных результатов
      # ---------------------------------------------------------
      - name: Проверка результатов
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "        РЕЗУЛЬТАТЫ ЗАПУСКА"
          echo "========================================"

          echo "Текущий номер: $NGG_RUN_NUMBER"

          echo ""
          echo "===== ПЛЕЙЛИСТЫ ====="

          find . -maxdepth 1 -type f \
            -name "*.m3u" \
            -printf '%f\n' | sort -V || true

          echo ""
          echo "===== Ai_Alias TXT ====="

          find . -maxdepth 1 -type f \
            -name "Ai_Alias*.txt" \
            -printf '%f\n' | sort -V || true

          echo ""
          echo "===== Ai_Alias JSON ====="

          find . -maxdepth 1 -type f \
            -name "Ai_Alias*.json" \
            -printf '%f\n' | sort -V || true

          echo ""
          echo "===== ngSKALA ====="

          find . -maxdepth 1 -type f \
            -name "ngSKALA*.txt" \
            -printf '%f\n' | sort -V || true

          echo ""
          echo "===== DATA / ML ====="

          find data -maxdepth 2 -type f \
            -printf '%p\n' 2>/dev/null | sort -V || true

          echo ""
          echo "===== БАЗЫ ====="

          for file in \
            knowledge.db \
            xml_2016_knowledge.json
          do
            if [ -f "$file" ]; then
              echo "[OK] $file"
              ls -lh "$file"
            fi
          done

      # ---------------------------------------------------------
      # 8. Проверка соответствия номера запуска
      #
      # Если Python создал playlist_N — проверяем его.
      # ---------------------------------------------------------
      - name: Проверка версии текущего запуска
        shell: bash
        run: |
          set -e

          EXPECTED="playlist_${NGG_RUN_NUMBER}.m3u"

          if [ -f "$EXPECTED" ]; then
            echo "[OK] Создан ожидаемый плейлист: $EXPECTED"
          else
            echo "[INFO] Файл $EXPECTED не найден."
            echo "Python-код может использовать собственную схему именования."
            echo "Продолжаем без удаления существующих результатов."
          fi

      # ---------------------------------------------------------
      # 9. Добавление ВСЕХ версий в Git
      #
      # НИЧЕГО не переименовываем.
      # НИЧЕГО не удаляем.
      # ---------------------------------------------------------
      - name: Подготовка всех результатов к коммиту
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "       ПОДГОТОВКА ВСЕХ ВЕРСИЙ"
          echo "========================================"

          # База знаний
          if [ -f knowledge.db ]; then
            git add -f knowledge.db
          fi

          # EPG knowledge
          if [ -f xml_2016_knowledge.json ]; then
            git add -f xml_2016_knowledge.json
          fi

          # Все ML-данные
          if [ -d data ]; then
            git add -f data/
          fi

          # ВСЕ плейлисты:
          # playlist.m3u
          # playlist_1.m3u
          # playlist_2.m3u
          # playlist_3.m3u
          # playlist_N.m3u
          find . -maxdepth 1 -type f \
            -name "*.m3u" \
            -exec git add -f {} \;

          # ВСЕ Ai_Alias версии
          find . -maxdepth 1 -type f \
            -name "Ai_Alias*.txt" \
            -exec git add -f {} \;

          find . -maxdepth 1 -type f \
            -name "Ai_Alias*.json" \
            -exec git add -f {} \;

          # ВСЕ ngSKALA версии
          find . -maxdepth 1 -type f \
            -name "ngSKALA*.txt" \
            -exec git add -f {} \;

          echo ""
          echo "===== STAGED CHANGES ====="
          git status --short

      # ---------------------------------------------------------
      # 10. Коммит и push
      # ---------------------------------------------------------
      - name: Сохранение результатов в репозитории
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --cached --quiet; then
            echo "Изменений нет."
            exit 0
          fi

          echo "========================================"
          echo "       СОХРАНЕНИЕ ВЕРСИИ"
          echo "========================================"

          git diff --cached --stat

          git commit \
            -m "auto: NGG AI evolution run ${NGG_RUN_NUMBER}"

          git push origin HEAD:${GITHUB_REF_NAME}

      # ---------------------------------------------------------
      # 11. Финальный статус
      # ---------------------------------------------------------
      - name: Завершение
        if: always()
        shell: bash
        run: |
          echo "========================================"
          echo "        NGG AI WORKFLOW FINISHED"
          echo "========================================"

          echo "Дата: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Workflow: $GITHUB_WORKFLOW"
          echo "Run: $GITHUB_RUN_NUMBER"
          echo "NGG version: ${NGG_RUN_NUMBER:-unknown}"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Status: ${{ job.status }}"