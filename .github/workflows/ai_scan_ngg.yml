name: Запуск AI Scan NGG и автокоммит

on:
  schedule:
    # Автозапуск каждые 6 часов (можно изменить под себя)
    - cron: '0 */6 * * *'
  workflow_dispatch:  # Ручной запуск из вкладки Actions

permissions:
  contents: write  # Разрешение на запись в репозиторий

jobs:
  run-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Шаг 1 — Получение репозитория
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0   # ВАЖНО: нужна полная история для корректного rebase

      - name: Шаг 2 — Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Шаг 3 — Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Шаг 4 — Запуск скрипта сканирования
        run: python ai_scan_ngg.py

      - name: Шаг 5 — Подготовка коммита
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff-index --quiet HEAD || git commit -m "Автообновление плейлиста через ai_scan_ngg.py [skip ci]"

      - name: Шаг 6 — Гарантированный push (pull --rebase)
        run: |
          git pull --rebase origin main
          git push origin main