name: AI Scan NGG и Автокоммит

on:
  schedule:
    # Автозапуск каждые 6 часов
    - cron: '0 */6 * * *'
  workflow_dispatch: # Ручной запуск из вкладки Actions

permissions:
  contents: write # Разрешение на запись в репозиторий

jobs:
  run-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Шаг 1 — Получение репозитория
        uses: actions/checkout@v4
        with:
          ref: main # Явно указываем ветку

      - name: Шаг 2 — Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Шаг 3 — Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Шаг 4 — Запуск скрипта сканирования
        run: python ai_scan_ngg.py

      - name: Шаг 5 — Абсолютно гарантированный коммит и push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Автообновление плейлиста через ai_scan_ngg.py [skip ci]"
          branch: main
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          skip_dirty_check: false
