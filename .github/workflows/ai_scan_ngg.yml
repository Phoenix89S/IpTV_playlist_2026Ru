name: ngg_scan_ai

on:
  schedule:
    # Запуск каждые 6 часов
    - cron: '0 */6 * * *'
  workflow_dispatch: # Ручной запуск из интерфейса GitHub

permissions:
  contents: write

jobs:
  scan-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Чтение репозитория
        uses: actions/checkout@v4

      - name: Настройка Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Кэширование зависимостей и данных ML
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            xml_2016_knowledge.json
            knowledge.db
            data/
          key: ${{ runner.os }}-iptv-cache-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-iptv-cache-

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install scikit-learn numpy joblib

      - name: Запуск сканера Alias Engine v4.7 beta
        run: |
          python ai_scan_ngg.py --scan

      - name: Сохранение результатов в репозиторий
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Фиксация сгенерированных отчетов, плейлиста и весов ML
          git add playlist.m3u Ai_Alias*.txt Ai_Alias*.json knowledge.db data/model.joblib xml_2016_knowledge.json || true
          
          if git status --porcelain | grep -E 'playlist|Ai_Alias|knowledge|model'; then
            git commit -m "auto: update playlist, ML-model and reports [ngg_scan_ai v4.7 beta]"
            git push
          else
            echo "Изменений не обнаружено. Пропуск push."
          fi
