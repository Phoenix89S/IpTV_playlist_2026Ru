name: NG_superscan_SKALA

on:
  workflow_dispatch:
  push:
    paths:
      - "NG_superscan_SKALA.py"
  schedule:
    - cron: "0 0 1 */2 *"   # запуск раз в 2 месяца

jobs:
  superscan:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Получение репозитория
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 📄 Загрузка движка NG_superscan_SKALA.py
        run: |
          curl -L \
          https://raw.githubusercontent.com/Phoenix89S/IpTV_playlist_2026Ru/main/NG_superscan_SKALA.py \
          -o NG_superscan_SKALA.py

      - name: 🚀 Запуск движка
        run: |
          python NG_superscan_SKALA.py

      - name: 📤 Проверка результатов
        run: |
          echo "=== Проверка файлов ==="
          ls -la

          REQUIRED="
          cdn_alias_inventory.json
          ngSuperscan_SKALA.txt
          ngSuperscan_SKALA_machine.txt
          ngSuperscan_SKALA.m3u
          "

          for f in $REQUIRED; do
            if [ ! -f "$f" ]; then
              echo "ОШИБКА: файл $f не создан!"
            else
              echo "OK: найден файл $f"
            fi
          done

      - name: 💾 Автокоммит результатов (только если есть изменения)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          FILES="
          cdn_alias_inventory.json
          ngSuperscan_SKALA.txt
          ngSuperscan_SKALA_machine.txt
          ngSuperscan_SKALA.m3u
          "

          echo "=== Добавление существующих файлов ==="
          for f in $FILES; do
            if [ -f "$f" ]; then
              echo "Добавляю: $f"
              git add "$f"
            else
              echo "Пропускаю отсутствующий: $f"
            fi
          done

          echo "=== Проверка изменений ==="
          if git diff --quiet && git diff --staged --quiet; then
            echo "Нет изменений — коммит не требуется"
            exit 0
          fi

          echo "=== Обнаружены изменения — выполняю коммит ==="
          git commit -m "auto: обновление отчётов NG_superscan_SKALA [skip ci]"

          echo "=== Обновляю локальную копию перед push ==="
          git pull --rebase

          echo "=== Выполняю push ==="
          git push