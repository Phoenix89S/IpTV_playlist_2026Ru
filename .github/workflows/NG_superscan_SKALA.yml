name: NG_superscan_SKALA

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 */2 *"   # запуск раз в 2 месяца

jobs:
  superscan:
    name: Запуск NADE SuperScan SKALA
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Шаг 1 — Клонирование репозитория
        uses: actions/checkout@v4

      - name: 🐍 Шаг 2 — Установка Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 📦 Шаг 3 — Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 📄 Шаг 4 — Загрузка NG_superscan_SKALA.py из GitHub RAW
        run: |
          curl -L \
          https://raw.githubusercontent.com/Phoenix89S/IpTV_playlist_2026Ru/main/NG_superscan_SKALA.py \
          -o NG_superscan_SKALA.py

      - name: 🚀 Шаг 5 — Запуск NADE SuperScan SKALA
        run: |
          python NG_superscan_SKALA.py

      - name: 📤 Шаг 6 — Сохранение результатов (логов и плейлистов)
        uses: actions/upload-artifact@v4
        with:
          name: NG_superscan_SKALA_results
          path: |
            cdn_alias_inventory.json
            ngSuperscan_SKALA.txt
            ngSuperscan_SKALA_machine.txt
            ngSuperscan_SKALA.m3u

      - name: 💾 Шаг 7 — Автокоммит результатов в репозиторий
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add cdn_alias_inventory.json ngSuperscan_SKALA.txt ngSuperscan_SKALA_machine.txt ngSuperscan_SKALA.m3u
          git commit -m "Обновление результатов NG_superscan_SKALA"
          git push