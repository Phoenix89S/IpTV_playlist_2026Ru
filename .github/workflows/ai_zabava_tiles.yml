name: ai_zabava_tiles

on:
  workflow_dispatch:
  push:
    paths:
      - "ai_zabava_tiles.py"
      - ".github/workflows/ai_zabava_tiles.yml"

jobs:
  run-ai-zabava:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate scanner JSON (auto-create)
        run: |
          echo "{
            \"scanner\": \"zabava_tails.py\",
            \"version\": \"1.0\",
            \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%S.%NZ)\",
            \"source\": \"auto-generated\",
            \"tails\": []
          }" > _scanner_zaba_1788021849270.txt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run ai_zabava_tiles.py
        run: |
          python ai_zabava_tiles.py

      - name: Commit generated results
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git add zabava_tiles.json || true
          git add zabava_tiles.txt || true
          git add zabava_tiles.m3u || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "AI Zabava Tiles: auto-update results"
            git push
          fi