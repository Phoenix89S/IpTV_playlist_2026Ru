name: ai_zabava_tiles

on:
  workflow_dispatch:
  push:
    paths:
      - "ai_zabava_tiles.py"
      - ".github/workflows/ai_zabava_tiles.yml"

jobs:
  run-ai-zabava:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install aiohttp requests

      - name: Run ai_zabava_tiles.py
        run: |
          set -e

          echo "========================================"
          echo "       START AI ZABAVA TILES"
          echo "========================================"

          python ai_zabava_tiles.py

          echo "========================================"
          echo "       SCAN FINISHED"
          echo "========================================"

      - name: Verify generated files
        run: |
          set -e

          echo "========================================"
          echo "       GENERATED FILES"
          echo "========================================"

          test -f playlist_ngenix_working.m3u
          test -f playlist_ngenix_data.json
          test -f skala_ngenix_report.txt
          test -f scan_ngenix_process.log
          test -f zabava_tails.txt
          test -f zabava_tails.json

          ls -lh \
            playlist_ngenix_working.m3u \
            playlist_ngenix_data.json \
            skala_ngenix_report.txt \
            scan_ngenix_process.log \
            zabava_tails.txt \
            zabava_tails.json

          echo "========================================"
          echo "       M3U ENTRIES"
          echo "========================================"

          grep -c '^#EXTINF:' playlist_ngenix_working.m3u || true

      - name: Commit generated results
        run: |
          set -e

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git add \
            playlist_ngenix_working.m3u \
            playlist_ngenix_data.json \
            skala_ngenix_report.txt \
            scan_ngenix_process.log \
            zabava_tails.txt \
            zabava_tails.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "AI Zabava Ngenix: auto-update results"
            git push
          fi