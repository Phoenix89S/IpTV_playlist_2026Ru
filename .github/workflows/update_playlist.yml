name: Update IPTV Playlist

on:
  schedule:
    # Запуск каждые 12 часов (в 00:00 и 12:00 UTC)
    - cron: '0 0,12 * * *'
  workflow_dispatch: # Возможность запустить вручную из вкладки Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Чеккаут репозитория
        uses: actions/checkout@v4

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Запуск скрипта парсинга и фильтрации
        run: python build_playlist.py

      - name: Коммит и Пуш изменений обратно в репозиторий
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add playlists/russian_and_hit_hd.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update IPTV playlist [skip ci]" && git push)
