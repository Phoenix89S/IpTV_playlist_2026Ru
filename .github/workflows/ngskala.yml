name: NGENIX-SKALA-DREG-Scan

on:
  workflow_dispatch:
  push:
    paths:
      - "ngSKAlA.py"

jobs:
  run-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Получение репозитория
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Запуск NGENIX SCALA/DREG сканера
        run: |
          python ngSKAlA.py

      - name: Публикация отчёта ngSlala.txt
        uses: actions/upload-artifact@v4
        with:
          name: ngSlala-report
          path: ngSlala.txt
          retention-days: 30