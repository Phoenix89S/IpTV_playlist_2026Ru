name: NGENIX-SKALA-DREG-Scan

on:
  workflow_dispatch:
  push:
    paths:
      - "ngSKAlA.py"

permissions:
  contents: write

jobs:
  run-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Получение репозитория
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Запуск NGENIX SCALA/DREG сканера
        run: |
          python ngSKAlA.py

      - name: Сохранение отчёта в репозиторий (Git Commit & Push)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ngScala.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: обновление отчёта ngScala.txt [skip ci]" && git push)

      - name: Публикация отчёта в артефактах
        uses: actions/upload-artifact@v4
        with:
          name: ngScala-report
          path: ngScala.txt
          retention-days: 30
